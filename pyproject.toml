[build-system]
requires = ["hatchling>=1.32.0,<2"]
build-backend = "hatchling.build"

[project]
name = "technocore-agent-orchestrator"
version = "0.1.0"
description = "A Windows orchestrator demonstrating Claude and Codex collaborating through Technocore"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=50.0.0,<51",
    "httpx>=0.28.1,<0.29",
    "mcp>=2.1.1,<3",
    "pydantic>=2.13.4,<3",
]

[project.scripts]
technocore-orchestrator = "technocore_orchestrator.cli:main"

[dependency-groups]
dev = [
    "coverage>=7.13.4,<8",
    "pip-audit>=2.10.1,<3",
    "pytest>=9.0.2,<10",
    "ruff>=0.16.4,<0.17",
    "ty>=0.0.74,<0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/technocore_orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "S", "SIM", "PIE", "RUF", "ASYNC", "DTZ", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["S603"]
"tests/**/*.py" = ["S101", "S104"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["technocore_orchestrator"]

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_covered = true

[tool.ty.environment]
python-version = "3.12"
